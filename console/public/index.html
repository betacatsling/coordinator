<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Coordinator</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/board" aria-label="Coordinator — board">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.25"/><circle cx="12" cy="12" r="3.25"/><path d="M12 1.75v4.5M12 17.75v4.5M1.75 12h4.5M17.75 12h4.5"/></svg>
        <span>Coordinator</span>
      </a>
      <div class="scope" id="scope-crumb" aria-live="polite"></div>
      <div class="top-actions">
        <button class="watch-pill" id="watch-pill" type="button" aria-label="Watcher status"></button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </header>
    <nav class="rail" aria-label="Primary">
      <a href="#/board" data-view="board"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="10.5" y="4" width="5" height="11" rx="1.5"/><rect x="17.5" y="4" width="3" height="7" rx="1.2"/></svg><span>Board</span></a>
      <a href="#/notices" data-view="notices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17V11a7 7 0 0 1 14 0v6l1.5 2h-17Z"/><path d="M10 21.5h4"/></svg><span>Notices</span><i class="badge" id="notice-badge" hidden></i></a>
      <a href="#/scope" data-view="scope"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.2 7.5 9.5 4.4-1.3 7.5-4.9 7.5-9.5V6Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg><span>Scope</span></a>
    </nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div class="drawer-scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1" hidden></aside>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
