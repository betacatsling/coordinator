<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8f8f6">
  <title>Project Delegation · 项目工作台</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到项目内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="项目导航">
      <a class="brand" href="/" aria-label="Project Delegation 首页"><span class="brand-icon" aria-hidden="true">⌘</span><span>Project<br><strong>Delegation</strong></span></a>
      <div class="sidebar-label">工作空间 <span id="project-count">—</span></div>
      <nav id="projects" aria-label="项目列表"><p class="muted small">正在读取项目…</p></nav>
      <div class="sidebar-bottom"><span class="read-only-dot"></span>只读工作台<p>规划和执行仍由 coordinator<br>与原生 executor 会话负责</p><button id="theme-toggle" class="theme-button" type="button" aria-label="切换深色模式">◐ <span>切换外观</span></button></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <span id="breadcrumb-project">项目概览</span></div><div class="topbar-actions"><span id="connection" class="connection">正在连接</span><button id="refresh" class="icon-button" type="button" aria-label="刷新项目数据" title="刷新数据">↻</button></div></header>
      <main id="main" tabindex="-1">
        <div id="notice" role="status" aria-live="polite"></div>
        <section class="page-heading"><div><div class="eyebrow">PROJECT WORKSPACE</div><h1 id="project-title">项目工作台</h1><p id="project-description">让每一项工作、每一个执行会话都有迹可循</p></div><div class="update-label" tabindex="0" title="展示本地保存的任务与会话记录；未验证进程是否仍在运行，也不是 GitHub 看板的实时全量视图" aria-label="本地状态快照，每 5 秒刷新。展示本地保存的任务与会话记录；未验证进程是否仍在运行，也不是 GitHub 看板的实时全量视图"><span class="live-dot"></span><span id="last-update">本地状态快照 · 每 5 秒刷新</span></div></section>
        <div id="content" aria-busy="true"><div class="loading-state"><span class="spinner"></span><h2>正在读取工作空间</h2><p>从本地项目状态中加载任务与会话</p></div></div>
        <footer class="page-footer"><span>Project Delegation <span class="footer-divider">/</span> 本地状态 · 只读视图</span><span>执行结束 ≠ 验收完成</span></footer>
      </main>
    </div>
  </div>
  <dialog id="executor-dialog" aria-labelledby="drawer-title"><div class="drawer-header"><span class="eyebrow">EXECUTOR DETAILS</span><button id="close-drawer" class="icon-button" type="button" aria-label="关闭执行会话详情">×</button></div><div id="drawer-content"></div></dialog>
</body>
</html>
